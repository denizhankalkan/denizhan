<section class="wrap section" id="path">
  <div class="section-head">
    <h2>The <em>path</em></h2>
  </div>

  <dl class="path">
    @for (entry of entries; track entry.when) {
      <dt class="label">{{ entry.when }}</dt>
      <dd>
        <strong>{{ entry.title }}</strong>
        <span>{{ entry.detail }}</span>
      </dd>
    }
  </dl>
</section>
