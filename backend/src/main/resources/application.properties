# Everything you may want to change about the backend is in this file.

spring.application.name=denizhankalkan-site

# Port the backend listens on. The Angular dev server forwards /api here (frontend/proxy.conf.json).
server.port=8080

# Contact notes are appended to this file, one JSON object per line.
site.messages-file=data/messages.jsonl

# Addresses allowed to call the API from a browser, separated by commas.
# Not needed when this backend also serves the site, which is the default setup.
site.allowed-origins=http://localhost:4200,https://denizhankalkan.com,https://www.denizhankalkan.com
